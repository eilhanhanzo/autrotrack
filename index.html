<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streetlight & Pothole Events Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body { margin:0; height:100%; font-family:system-ui; }
#map { height:60%; }

.panel {
  padding:14px;
  max-height:40%;
  overflow:auto;
}

table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
th, td { border:1px solid #ddd; padding:5px; text-align:center; }
th { background:#f2f2f2; }
tr:hover { background:#eef; }
.mode-pothole { background:#ffe0e0; }
.mode-streetlight { background:#e0f7ff; }
</style>
</head>

<body>
<div id="map"></div>

<div class="panel">
<h3>🗄 Streetlight & Pothole Events</h3>
<table>
<thead>
<tr>
  <th>Timestamp (ms)</th>
  <th>UTC</th>
  <th>Fix</th>
  <th>Quality</th>
  <th>#Sats</th>
  <th>Latitude</th>
  <th>Longitude</th>
  <th>Altitude (m)</th>
  <th>Lux</th>
  <th>Status</th>
  <th>Mode</th>
</tr>
</thead>
<tbody id="eventTable"></tbody>
</table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const EVENTS_URL = "http://localhost:3000/streetlight_events";

let map, markers = [];

function initMap() {
    map = L.map('map').setView([5.7, 115.94], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

async function loadEvents() {
    try {
        const res = await fetch(EVENTS_URL);
        const events = await res.json();

        const tbody = document.getElementById("eventTable");
        tbody.innerHTML = "";

        markers.forEach(m => map.removeLayer(m));
        markers = [];

        events.forEach(e => {
            // Table row
            const tr = document.createElement("tr");
            tr.className = e.mode === "pothole" ? "mode-pothole" : "mode-streetlight";
            tr.innerHTML = `
                <td>${e.timestamp_ms}</td>
                <td>${e.utc_datetime}</td>
                <td>${e.has_fix ? 1 : 0}</td>
                <td>${e.fix_quality}</td>
                <td>${e.num_sats}</td>
                <td>${e.latitude.toFixed(6)}</td>
                <td>${e.longitude.toFixed(6)}</td>
                <td>${e.altitude_m}</td>
                <td>${e.lux}</td>
                <td>${e.status || ''}</td>
                <td>${e.mode}</td>
            `;
            tbody.appendChild(tr);

            // Map marker
            const marker = L.circleMarker([e.latitude, e.longitude], {
                radius: 6,
                color: e.mode === "pothole" ? "red" : "blue",
                fillOpacity: 0.7
            }).addTo(map).bindPopup(
                `Mode: ${e.mode}<br>Lux: ${e.lux}<br>Alt: ${e.altitude_m} m`
            );
            markers.push(marker);
        });

    } catch(err) {
        console.error("Failed to load events:", err);
    }
}

// Initialize
initMap();
loadEvents();
</script>
</body>
</html>
