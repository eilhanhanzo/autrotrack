<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streetlight Events Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body { margin:0; height:100%; font-family:system-ui; }
#map { height:50%; }
.panel {
  padding:14px;
  max-height:50%;
  overflow:auto;
  background:#f9f9f9;
}
table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
th, td { border:1px solid #ddd; padding:5px; text-align:center; }
th { background:#f2f2f2; }
tr:hover { background:#eef; }
.on { color:green; font-weight:bold; }
.off { color:red; font-weight:bold; }
</style>
</head>

<body>
<div id="map"></div>

<div class="panel">
<h3>🌍 Streetlight Events</h3>
<table>
<thead>
<tr>
  <th>Timestamp</th>
  <th>Has Fix</th>
  <th>Fix Quality</th>
  <th>Num Sats</th>
  <th>Lat</th>
  <th>Lon</th>
  <th>Alt (m)</th>
  <th>Lux</th>
  <th>Status</th>
  <th>Mode</th>
</tr>
</thead>
<tbody id="eventTable"></tbody>
</table>
<div id="msg"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const EVENT_URL = "https://drone-backend-1oq4.onrender.com/streetlights";

let map, markers = [];

function showMsg(text, ok=true) {
  const msg = document.getElementById("msg");
  msg.textContent = text;
  msg.style.color = ok ? "green" : "red";
}

function initMap() {
  map = L.map('map').setView([5.7, 115.94], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

async function loadEvents() {
  try {
    const res = await fetch(EVENT_URL);
    if (!res.ok) throw new Error(res.status);
    const events = await res.json();

    const tbody = document.getElementById("eventTable");
    tbody.innerHTML = "";

    markers.forEach(m => map.removeLayer(m));
    markers = [];

    events.forEach(e => {
      // Table row
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${e.utc_datetime}</td>
        <td>${e.has_fix}</td>
        <td>${e.fix_quality}</td>
        <td>${e.num_sats}</td>
        <td>${e.latitude.toFixed(6)}</td>
        <td>${e.longitude.toFixed(6)}</td>
        <td>${e.altitude_m}</td>
        <td>${e.lux.toFixed(2)}</td>
        <td class="${e.status==='ON'?'on':'off'}">${e.status}</td>
        <td>${e.mode || ''}</td>
      `;
      tbody.appendChild(tr);

      // Map marker
      const marker = L.marker([e.latitude, e.longitude]).addTo(map);
      marker.bindPopup(`Lux: ${e.lux.toFixed(2)}<br>Status: ${e.status}<br>Mode: ${e.mode || ''}`);
      markers.push(marker);
    });

    showMsg(`Loaded ${events.length} events.`);
  } catch (err) {
    console.error(err);
    showMsg("Failed to load events.", false);
  }
}

window.onload = () => {
  initMap();
  loadEvents();
};
</script>
</body>
</html>
