<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Streetlight Monitoring Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body, html {
      margin: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    #map {
      height: 100%;
    }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 320px;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-height: 95vh;
      overflow-y: auto;
    }

    h3 {
      margin-top: 0;
      font-size: 16px;
    }

    label {
      font-size: 13px;
      margin-top: 8px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 7px;
      margin-top: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }

    th {
      background: #f2f2f2;
    }

    tr:hover {
      background: #e6f2ff;
      cursor: pointer;
    }

    .on { color: green; font-weight: bold; }
    .off { color: red; font-weight: bold; }

    #message {
      margin-top: 8px;
      font-size: 13px;
    }

    #coords {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>

<body>

<div class="panel">
  <h3>➕ Add Streetlight Event</h3>

  <form id="eventForm">
    <label>Latitude</label>
    <input type="number" id="lat" step="any" required>

    <label>Longitude</label>
    <input type="number" id="lon" step="any" required>

    <label>Status</label>
    <select id="status">
      <option value="ON">ON</option>
      <option value="OFF">OFF</option>
    </select>

    <label>Lux</label>
    <input type="number" id="lux" step="any" required>

    <button type="submit">Submit Event</button>
  </form>

  <div id="message"></div>

  <h3>📊 Streetlight Events (Database)</h3>
  <table id="dataTable">
    <thead>
      <tr>
        <th>Status</th>
        <th>Lux</th>
        <th>Latitude</th>
        <th>Longitude</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div id="coords">Click map to fill coordinates</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const API_URL = 'https://drone-backend-1oq4.onrender.com/streetlight-events';

  let map;
  let markers = [];

  // ---------- UTIL ----------
  function uuid() {
    return crypto.randomUUID();
  }

  function backendTime() {
    return new Date().toISOString()
      .replace('T', ' ')
      .replace(/\.\d+Z$/, '+00');
  }

  function msg(text, ok = true) {
    const m = document.getElementById('message');
    m.textContent = text;
    m.style.color = ok ? 'green' : 'red';
  }

  // ---------- MAP ----------
  function initMap() {
    map = L.map('map').setView([5.7, 115.94], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    map.on('click', e => {
      lat.value = e.latlng.lat.toFixed(6);
      lon.value = e.latlng.lng.toFixed(6);
      coords.textContent = `Lat: ${lat.value}, Lon: ${lon.value}`;
    });
  }

  // ---------- FETCH + RENDER ----------
  async function loadEvents() {
    const res = await fetch(API_URL);
    const data = await res.json();

    markers.forEach(m => map.removeLayer(m));
    markers = [];
    document.querySelector('#dataTable tbody').innerHTML = '';

    data.forEach(e => {
      const marker = L.marker([e.lat, e.lon]).addTo(map);
      marker.bindPopup(`
        <b>Status:</b> ${e.status}<br>
        <b>Lux:</b> ${e.lux}<br>
        <b>Time:</b> ${e.time}
      `);
      markers.push(marker);

      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="${e.status === 'ON' ? 'on' : 'off'}">${e.status}</td>
        <td>${e.lux}</td>
        <td>${e.lat.toFixed(4)}</td>
        <td>${e.lon.toFixed(4)}</td>
        <td>${e.time}</td>
      `;

      row.onclick = () => {
        map.setView([e.lat, e.lon], 18);
        marker.openPopup();
      };

      document.querySelector('#dataTable tbody').appendChild(row);
    });
  }

  // ---------- SUBMIT ----------
  eventForm.addEventListener('submit', async e => {
    e.preventDefault();

    const payload = {
      lat: parseFloat(lat.value),
      lon: parseFloat(lon.value),
      status: status.value,
      lux: parseFloat(lux.value),
      flight_id: uuid(),
      time: backendTime()
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error();
      msg('Event added');
      loadEvents();
      eventForm.reset();
    } catch {
      msg('POST failed (backend likely read-only)', false);
    }
  });

  // ---------- INIT ----------
  window.onload = () => {
    initMap();
    loadEvents();
  };
</script>

</body>
</html>
