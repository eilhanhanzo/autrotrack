<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streetlight Live Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
  body, html { margin: 0; padding: 0; height: 100%; }
  #map { height: 100%; width: 100%; }
  #timestamp { padding:10px; font-size:16px; font-weight:bold; }
</style>
</head>

<body>

<div id="timestamp">Latest timestamp: -</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ---- 1. Correct API URL ----
const API_URL = "https://drone-backend-1oq4.onrender.com/streetlight-events";

// ---- 2. Create map ----
let map = L.map("map").setView([5.72, 115.94], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19
}).addTo(map);

// ---- 3. Red OFF icon ----
const redIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/463/463292.png",
  iconSize: [32, 32],
  iconAnchor: [16, 32]
});

// ---- 4. Green ON icon ----
const greenIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/190/190411.png",
  iconSize: [32, 32],
  iconAnchor: [16, 32]
});

let markers = [];

// ---- 5. Fetch data from backend ----
async function fetchEvents() {
  try {
    const res = await fetch(API_URL);
    const events = await res.json();

    markers.forEach(m => map.removeLayer(m));
    markers = [];

    if (events.length === 0) return;

    // newest event is first because backend sorts DESC
    let lastEvent = events[0];

    document.getElementById("timestamp").innerText =
      "Latest timestamp: " + lastEvent.time;

    events.forEach(e => {
      let icon = e.status === "OFF" ? redIcon : greenIcon;

      let m = L.marker([e.lat, e.lon], { icon })
        .addTo(map)
        .bindPopup(`
          <b>Streetlight Event</b><br>
          Lux: ${e.lux}<br>
          Status: ${e.status}<br>
          Time: ${e.time}
        `);

      markers.push(m);
    });

  } catch (err) {
    console.error("API error:", err);
  }
}

// update every 5 seconds
fetchEvents();
setInterval(fetchEvents, 5000);

</script>
</body>
</html>
