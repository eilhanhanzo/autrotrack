<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Streetlight Live Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    #map { height: 100%; }

    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 280px;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 10px;
    }

    label {
      font-size: 14px;
      margin-top: 10px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #statusMessage {
      margin-top: 10px;
      font-size: 14px;
    }

    #coordinates {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>

<body>

<div class="control-panel">
  <div class="section-title">➕ Add Streetlight Event</div>

  <form id="addEventForm">
    <label>Latitude</label>
    <input type="number" id="lat" step="any" required>

    <label>Longitude</label>
    <input type="number" id="lon" step="any" required>

    <label>Status</label>
    <select id="status" required>
      <option value="ON">ON</option>
      <option value="OFF">OFF</option>
    </select>

    <label>Lux Value</label>
    <input type="number" id="lux" step="any" required>

    <button type="submit">Submit Event</button>
  </form>

  <div id="statusMessage"></div>
</div>

<div id="coordinates">Click map to autofill coordinates</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const API_URL = 'https://drone-backend-1oq4.onrender.com/streetlight-events';

  let map;
  let markers = [];

  // ---------- UTILITIES ----------
  function generateUUID() {
    return crypto.randomUUID();
  }

  function getBackendTime() {
    return new Date()
      .toISOString()
      .replace('T', ' ')
      .replace(/\.\d+Z$/, '+00');
  }

  function showMessage(msg, success = true) {
    const el = document.getElementById('statusMessage');
    el.textContent = msg;
    el.style.color = success ? 'green' : 'red';
  }

  // ---------- MAP ----------
  function initMap() {
    map = L.map('map').setView([5.70, 115.94], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    map.on('click', (e) => {
      document.getElementById('lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('lon').value = e.latlng.lng.toFixed(6);
      document.getElementById('coordinates').textContent =
        `Lat: ${e.latlng.lat.toFixed(6)}, Lon: ${e.latlng.lng.toFixed(6)}`;
    });
  }

  // ---------- FETCH EVENTS ----------
  async function fetchEvents() {
    const res = await fetch(API_URL);
    const events = await res.json();

    markers.forEach(m => map.removeLayer(m));
    markers = [];

    events.forEach(e => {
      const marker = L.marker([e.lat, e.lon]).addTo(map);
      marker.bindPopup(`
        <b>Status:</b> ${e.status}<br>
        <b>Lux:</b> ${e.lux}<br>
        <b>Time:</b> ${e.time}
      `);
      markers.push(marker);
    });
  }

  // ---------- FORM SUBMIT ----------
  document.getElementById('addEventForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      lat: parseFloat(lat.value),
      lon: parseFloat(lon.value),
      status: status.value,
      lux: parseFloat(lux.value),
      flight_id: generateUUID(),
      time: getBackendTime()
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error('POST failed');

      showMessage('Event added successfully');
      fetchEvents();
      e.target.reset();
    } catch (err) {
      showMessage('Failed to add event', false);
    }
  });

  // ---------- INIT ----------
  window.onload = () => {
    initMap();
    fetchEvents();
  };
</script>

</body>
</html>
