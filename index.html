<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Streetlight Live Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
        sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #timestamp {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="timestamp">Loading streetlight events…</div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // --- 1. API URL (your backend) ---
    const API_URL =
      'https://drone-backend-1oq4.onrender.com/streetlight-events';

    let map;
    let markers = [];
    const timestampEl = document.getElementById('timestamp');

    // --- 2. Icons for ON / OFF ---
    const redIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/463/463292.png', // OFF
      iconSize: [28, 28],
      iconAnchor: [14, 28],
      popupAnchor: [0, -28],
    });

    const greenIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/190/190411.png', // ON
      iconSize: [28, 28],
      iconAnchor: [14, 28],
      popupAnchor: [0, -28],
    });

    // --- 3. Initialise map ---
    function initMap() {
      map = L.map('map').setView([5.70, 115.94], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
      }).addTo(map);
    }

    // --- 4. Fetch events from backend ---
    async function fetchEvents() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }
        const events = await res.json();

        updateMarkers(events);
      } catch (err) {
        console.error('API error:', err);
        timestampEl.textContent = 'Error loading data';
      }
    }

    // --- 5. Update markers on the map ---
    function updateMarkers(events) {
      // Clear old markers
      markers.forEach((m) => map.removeLayer(m));
      markers = [];

      if (!events || events.length === 0) {
        timestampEl.textContent = 'No streetlight events yet';
        return;
      }

      // Backend orders DESC by time, so first element is latest
      const latest = events[0];
      timestampEl.textContent = 'Latest event: ' + latest.time;

      const bounds = [];

      events.forEach((e) => {
        if (typeof e.lat !== 'number' || typeof e.lon !== 'number') return;

        const icon = e.status === 'OFF' ? redIcon : greenIcon;

        const marker = L.marker([e.lat, e.lon], { icon }).addTo(map);

        marker.bindPopup(
          `
          <b>Streetlight status:</b> ${e.status}<br/>
          <b>Lux:</b> ${e.lux}<br/>
          <b>Time:</b> ${e.time}<br/>
          <b>Flight:</b> ${e.flight_id || 'N/A'}
        `
        );

        markers.push(marker);
        bounds.push([e.lat, e.lon]);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    }

    // --- 6. Boot ---
    window.onload = function () {
      initMap();
      fetchEvents();
      setInterval(fetchEvents, 5000); // refresh every 5 seconds
    };
  </script>
</body>
</html>
