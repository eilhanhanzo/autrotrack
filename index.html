<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Streetlight Coordinate Validation System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    #map { height: 100%; }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 340px;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-height: 95vh;
      overflow-y: auto;
    }

    h3 { margin-top: 0; }

    label {
      font-size: 13px;
      margin-top: 8px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 7px;
      margin-top: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }

    th { background: #f2f2f2; }

    tr:hover {
      background: #e6f2ff;
      cursor: pointer;
    }

    .on { color: green; font-weight: bold; }
    .off { color: red; font-weight: bold; }

    #msg {
      margin-top: 8px;
      font-size: 13px;
    }

    #coords {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>

<body>

<div class="panel">
  <h3>➕ Add Streetlight Event</h3>

  <form id="eventForm">
    <label>Latitude</label>
    <input type="number" id="lat" step="any" required>

    <label>Longitude</label>
    <input type="number" id="lon" step="any" required>

    <label>Status</label>
    <select id="status">
      <option value="ON">ON</option>
      <option value="OFF">OFF</option>
    </select>

    <label>Lux</label>
    <input type="number" id="lux" step="any" required>

    <button type="submit">Save Event</button>
  </form>

  <div id="msg"></div>

  <h3>📊 Local Streetlight Table</h3>
  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Lux</th>
        <th>Lat</th>
        <th>Lon</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div id="coords">Click map to fill coordinates</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  let map;
  let markers = [];
  let streetlightDB = JSON.parse(localStorage.getItem('streetlights')) || [];

  // ---------- UTIL ----------
  function nowUTC() {
    return new Date().toISOString()
      .replace('T', ' ')
      .replace(/\.\d+Z$/, '+00');
  }

  function message(text, ok = true) {
    msg.textContent = text;
    msg.style.color = ok ? 'green' : 'red';
  }

  function coordsMatch(a, b) {
    return a.lat.toFixed(6) === b.lat.toFixed(6) &&
           a.lon.toFixed(6) === b.lon.toFixed(6);
  }

  function saveLocal() {
    localStorage.setItem('streetlights', JSON.stringify(streetlightDB));
  }

  // ---------- MAP ----------
  function initMap() {
    map = L.map('map').setView([5.7, 115.94], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    map.on('click', e => {
      lat.value = e.latlng.lat.toFixed(6);
      lon.value = e.latlng.lng.toFixed(6);
      coords.textContent = `Lat: ${lat.value}, Lon: ${lon.value}`;
    });
  }

  // ---------- RENDER ----------
  function render() {
    tableBody.innerHTML = '';
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    streetlightDB.forEach(e => {
      const marker = L.marker([e.lat, e.lon]).addTo(map);
      marker.bindPopup(`
        <b>Status:</b> ${e.status}<br>
        <b>Lux:</b> ${e.lux}<br>
        <b>Time:</b> ${e.time}
      `);
      markers.push(marker);

      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="${e.status === 'ON' ? 'on' : 'off'}">${e.status}</td>
        <td>${e.lux}</td>
        <td>${e.lat.toFixed(4)}</td>
        <td>${e.lon.toFixed(4)}</td>
        <td>${e.time}</td>
      `;

      row.onclick = () => {
        map.setView([e.lat, e.lon], 18);
        marker.openPopup();
      };

      tableBody.appendChild(row);
    });
  }

  // ---------- SUBMIT ----------
  eventForm.addEventListener('submit', e => {
    e.preventDefault();

    const newEvent = {
      lat: parseFloat(lat.value),
      lon: parseFloat(lon.value),
      status: status.value,
      lux: parseFloat(lux.value),
      time: nowUTC()
    };

    const exists = streetlightDB.some(e => coordsMatch(e, newEvent));

    if (exists) {
      message('Streetlight already exists at this coordinate', false);
      return;
    }

    streetlightDB.push(newEvent);
    saveLocal();
    render();
    message('New streetlight added');
    eventForm.reset();
  });

  // ---------- INIT ----------
  window.onload = () => {
    initMap();
    render();
  };
</script>

</body>
</html>
