<script>
const BACKEND_URL = "http://localhost:3000/streetlights";
const FLIGHT_ID = "2a6caa32-3f9f-4ed5-8b81-e2f0b77ab8ac"; // MUST EXIST

let map, markers=[], highlightMarker=null;
let backendDB=[];
let selectedRow=null;

// ---------- UTIL ----------
const showMsg = (t, ok=true) => {
  msg.textContent=t;
  msg.style.color=ok?'green':'red';
};

const nowUTC = () =>
  new Date().toISOString();

// ---------- MAP ----------
function initMap(){
  map=L.map('map').setView([5.7,115.94],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  map.on('click',e=>{
    lat.value=e.latlng.lat.toFixed(6);
    lon.value=e.latlng.lng.toFixed(6);
    coords.textContent=`Lat:${lat.value}, Lon:${lon.value}`;
  });
}

// ---------- HIGHLIGHT ----------
function highlightOnMap(lat, lon, index=null){
  if (highlightMarker) map.removeLayer(highlightMarker);

  highlightMarker = L.circleMarker([lat, lon], {
    radius: 10,
    color: '#007bff',
    fillColor: '#007bff',
    fillOpacity: 0.7,
    weight: 3
  }).addTo(map);

  map.panTo([lat, lon]);

  const rows=document.querySelectorAll('#backendTable tr');
  rows.forEach(r=>r.classList.remove('selected'));
  if(index!==null && rows[index]) rows[index].classList.add('selected');
}

// ---------- BACKEND ----------
async function loadBackend(){
  const r = await fetch(BACKEND_URL);
  backendDB = await r.json();
}

// ---------- RENDER ----------
function render(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  backendTable.innerHTML='';

  backendDB.forEach((e,i)=>{
    const m=L.marker([e.lat,e.lon]).addTo(map);
    markers.push(m);

    const row=document.createElement('tr');
    row.innerHTML=`
      <td class="${e.status==='ON'?'on':'off'}">${e.status}</td>
      <td>${e.lux}</td>
      <td>${e.lat.toFixed(4)}</td>
      <td>${e.lon.toFixed(4)}</td>
      <td class="actions">
        <button onclick="editEntry('${e.id}',${i})">Edit</button>
        <button class="danger" onclick="deleteEntry('${e.id}')">Del</button>
      </td>
    `;

    row.onclick=()=>highlightOnMap(e.lat,e.lon,i);
    backendTable.appendChild(row);
  });
}

// ---------- ADD / EDIT ----------
eventForm.addEventListener('submit',async e=>{
  e.preventDefault();

  const payload={
    flight_id: FLIGHT_ID,
    time: nowUTC(),
    lat:+lat.value,
    lon:+lon.value,
    lux:+lux.value,
    status:status.value
  };

  const id=editIndex.value;

  const url = id
    ? `${BACKEND_URL}/${id}`
    : BACKEND_URL;

  const method = id ? "PUT" : "POST";

  await fetch(url,{
    method,
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(payload)
  });

  showMsg(id?"Updated":"Added");
  resetForm();
  await loadBackend();
  render();
});

// ---------- EDIT ----------
function editEntry(id,index){
  const e=backendDB[index];
  lat.value=e.lat;
  lon.value=e.lon;
  lux.value=e.lux;
  status.value=e.status;
  editIndex.value=id;
  showMsg("Editing entry");
  highlightOnMap(e.lat,e.lon,index);
}

// ---------- DELETE ----------
async function deleteEntry(id){
  if(!confirm("Delete this entry?")) return;

  await fetch(`${BACKEND_URL}/${id}`,{ method:"DELETE" });
  showMsg("Deleted");
  await loadBackend();
  render();
}

function resetForm(){
  eventForm.reset();
  editIndex.value="";
}

// ---------- INIT ----------
window.onload=async()=>{
  initMap();
  await loadBackend();
  render();
};
</script>
