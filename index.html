<!DOCTYPE html>
<html>
<head>
  <title>Streetlight Live Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { height: 100%; width: 100%; }
    #timestamp { padding:10px; font-size:16px; font-weight:bold; }
  </style>
</head>

<body>

<div id="timestamp">Latest timestamp: -</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ---- 1. Your friend’s API URL ----
const API_URL = "http://yourserver.com/streetlight-events";

// ---- 2. Create map ----
let map = L.map("map").setView([5.72, 115.94], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19
}).addTo(map);

// ---- 3. Red icon for OFF streetlight ----
const redIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/463/463292.png",
  iconSize: [32, 32],
  iconAnchor: [16, 32]
});

// ---- 4. Store markers so we can update ----
let markers = [];

// ---- 5. Fetch data from PostgreSQL API ----
async function fetchEvents() {
  try {
    const res = await fetch(API_URL);
    const events = await res.json();

    // remove old markers
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    if (events.length === 0) return;

    let lastEvent = events[events.length - 1];
    document.getElementById("timestamp").innerText =
      "Latest timestamp: " + lastEvent.timestamp;

    // add all markers
    events.forEach(e => {
      let m = L.marker([e.lat, e.lon], { icon: redIcon })
        .addTo(map)
        .bindPopup(`
          <b>Streetlight Event</b><br>
          Lux: ${e.lux}<br>
          Time: ${e.timestamp}
        `);

      markers.push(m);
    });

  } catch (err) {
    console.error("API error:", err);
  }
}

// ---- 6. Update every 5 seconds ----
fetchEvents();
setInterval(fetchEvents, 5000);

</script>
</body>
</html>
