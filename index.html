<script>
const BACKEND_URL = 'https://drone-backend-1oq4.onrender.com/streetlight-events';

let map;
let markers = [];
let backendDB = [];
let localDB = JSON.parse(localStorage.getItem('localStreetlights')) || [];

// ---------- UTIL ----------
function nowUTC() {
  return new Date().toISOString().replace('T',' ').replace(/\.\d+Z$/,'+00');
}

function coordKey(e) {
  return `${e.lat.toFixed(6)}_${e.lon.toFixed(6)}`;
}

function showMsg(text, ok = true) {
  msg.textContent = text;
  msg.style.color = ok ? 'green' : 'red';
}

function saveLocal() {
  localStorage.setItem('localStreetlights', JSON.stringify(localDB));
}

// ---------- MAP ----------
function initMap() {
  map = L.map('map').setView([5.7, 115.94], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  map.on('click', e => {
    lat.value = e.latlng.lat.toFixed(6);
    lon.value = e.latlng.lng.toFixed(6);
    coords.textContent = `Lat: ${lat.value}, Lon: ${lon.value}`;
  });
}

// ---------- LOAD BACKEND ----------
async function loadBackend() {
  const res = await fetch(BACKEND_URL);
  backendDB = await res.json();
}

// ---------- RENDER ----------
function render() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  localTable.innerHTML = '';
  backendTable.innerHTML = '';

  const backendKeys = new Set(backendDB.map(coordKey));

  // Backend
  backendDB.forEach(e => {
    const m = L.marker([e.lat, e.lon]).addTo(map);
    markers.push(m);

    backendTable.innerHTML += `
      <tr>
        <td class="${e.status === 'ON' ? 'on' : 'off'}">${e.status}</td>
        <td>${e.lux}</td>
        <td>${e.lat.toFixed(4)}</td>
        <td>${e.lon.toFixed(4)}</td>
      </tr>`;
  });

  // Local
  localDB.forEach((e, i) => {
    const synced = backendKeys.has(coordKey(e));

    const m = L.circleMarker([e.lat, e.lon], {
      radius: 6,
      color: synced ? 'green' : 'orange'
    }).addTo(map);
    markers.push(m);

    localTable.innerHTML += `
      <tr class="${synced ? 'synced' : 'unsynced'}">
        <td>${synced ? 'SYNCED' : 'NOT SYNCED'}</td>
        <td class="${e.status === 'ON' ? 'on' : 'off'}">${e.status}</td>
        <td>${e.lux}</td>
        <td>${e.lat.toFixed(4)}</td>
        <td>${e.lon.toFixed(4)}</td>
        <td>
          <button onclick="editEntry(${i})">Edit</button>
          <button onclick="deleteEntry(${i})" style="background:#dc3545">Delete</button>
        </td>
      </tr>`;
  });
}

// ---------- CRUD ----------
eventForm.addEventListener('submit', e => {
  e.preventDefault();

  const entry = {
    lat: +lat.value,
    lon: +lon.value,
    status: status.value,
    lux: +lux.value,
    time: nowUTC()
  };

  if (editIndex.value !== '') {
    localDB[editIndex.value] = entry;
    showMsg('Entry updated');
  } else {
    if (localDB.some(e => coordKey(e) === coordKey(entry))) {
      showMsg('Already exists in local DB', false);
      return;
    }
    localDB.push(entry);
    showMsg('Saved locally');
  }

  saveLocal();
  render();
  resetForm();
});

function editEntry(i) {
  const e = localDB[i];
  lat.value = e.lat;
  lon.value = e.lon;
  status.value = e.status;
  lux.value = e.lux;
  editIndex.value = i;
  showMsg('Editing entry');
}

function deleteEntry(i) {
  if (!confirm('Delete this entry?')) return;
  localDB.splice(i, 1);
  saveLocal();
  render();
  showMsg('Entry deleted');
}

function resetForm() {
  eventForm.reset();
  editIndex.value = '';
}

// ---------- INIT ----------
window.onload = async () => {
  initMap();
  await loadBackend();
  render();
};
</script>
